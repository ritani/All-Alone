<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Buried City - Zombie Survival Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #game-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/scenes/SplashScene.js"></script>
    <script src="js/scenes/MenuScene.js"></script>
    <script src="js/scenes/GameScene.js"></script>
    <script src="js/scenes/MapScene.js"></script>
    <script src="js/scenes/ExpeditionPlanScene.js"></script>
    <script src="js/scenes/LootSelectionScene.js"></script>
    <script src="js/scenes/TravelAnimationScene.js"></script>
    <script src="js/managers/InventoryManager.js"></script>
    <script src="js/managers/CraftingManager.js"></script>
    <script src="js/managers/LocationManager.js"></script>
    <script src="js/managers/ExpeditionManager.js"></script>
    <script src="js/managers/BuildingManager.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
