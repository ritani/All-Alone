[workspace]
members = ["crates/core"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"

# The simulation is exercised by long headless playthroughs in tests; a little
# optimisation keeps `cargo test` quick without hurting debuggability much.
[profile.dev]
opt-level = 1

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
