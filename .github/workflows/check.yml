# Typecheck, lint, test, build and audit on every push and pull request.
# Pushes to main (production) and MVP (staging) are then deployed to
# Cloudflare Pages, but only after the check job has passed.
# Actions are pinned to full commit SHAs (the tag is in the comment); the job
# can only read the repository.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      WASM_PACK_VERSION: 0.15.1
      CARGO_AUDIT_VERSION: 0.23.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.12.0
          cache: npm

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
          rustup default stable

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ env.WASM_PACK_VERSION }}-${{ env.CARGO_AUDIT_VERSION }}

      - name: Rust tools (exact versions, from crates.io, locked)
        run: |
          command -v wasm-pack >/dev/null || cargo install wasm-pack --version "$WASM_PACK_VERSION" --locked
          command -v cargo-audit >/dev/null || cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked

      - name: Install (lockfile only, no install scripts)
        run: npm ci --ignore-scripts

      - name: Check (Rust fmt, clippy, tests; wasm build; typecheck; lint; Vitest; production build)
        run: npm run check

      - name: Audit npm dependencies
        run: npm audit --audit-level=low

      - name: Audit Rust dependencies
        run: cargo audit --deny warnings

      # The exact files that were checked are the files that get deployed.
      - name: Keep the built site for the deploy job
        if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'MVP')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist
          if-no-files-found: error
          retention-days: 7

  # Deploys the checked build to Cloudflare Pages. main is production; MVP is
  # the staging preview (https://mvp.<project>.pages.dev). Off until the
  # repository variable CLOUDFLARE_PAGES_PROJECT is set; see docs/DEPLOY.md.
  # This job never checks out or runs repository code, so the Cloudflare
  # token is only ever seen by the pinned deploy action.
  deploy:
    needs: check
    if: >-
      github.event_name == 'push'
      && (github.ref_name == 'main' || github.ref_name == 'MVP')
      && vars.CLOUDFLARE_PAGES_PROJECT != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.168.0
          packageManager: npm
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=${{ github.ref_name }} --commit-hash=${{ github.sha }} --commit-dirty=true
